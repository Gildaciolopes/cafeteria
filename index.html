<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <nav>
      <div class="container">
        <ul class="flex justify-between items-center">
          <li>
            <a href="#"><img src="assets/images/logo_coffe.svg" alt="" /></a>
          </li>
          <li><a href="#">About us</a></li>
          <li><a href="#">Our Product</a></li>
          <li><a href="#">Delivery</a></li>
          <div id="search-form">
            <input
              class="search-bar"
              type="text"
              id="search-input"
              placeholder="Cappucino"
              autocomplete="off"
            />
          </div>
          <li>
            <a href="#"><img src="assets/images/icons_cart.svg" alt="" /></a>
          </li>
        </ul>
      </div>
    </nav>
    <main>
      <section class="popular grid grid-cols-2">
        <div class="popular-text p-[80px]">
          <h1 class="text-[58px] font-semibold">
            Enjoy your <span>coffee</span> before your activity
          </h1>
          <p class="text-[18px] text-slate-500">
            Boost your productivity and build your <br />
            mood with a glass of coffee in the morning
          </p>
          <div class="buttons flex">
            <button class="btn-primary flex items-center gap-2">
              Order now <img src="assets/images/Group 2.svg" alt="" />
            </button>
            <button class="btn-secondary">More menu</button>
          </div>
        </div>
        <div class="thumb-image">
          <img src="assets/images/img-hero.svg" alt="" />
        </div>
      </section>
      <section class="coffee-popular">
        <h2 class="text-[32px] font-semibold">Popular <span>Now</span></h2>
        <section class="container-coffee grid grid-cols-3 gap-10">
          <article>
            <div class="coffee-card">
              <div class="coffee-image">
                <img src="assets/images/unsplash_RFHFV7lVQBY.svg" alt="" />
              </div>
              <div class="coffee-description">
                <div class="coffee-text flex justify-between">
                  <h2>Vanilla Latte</h2>
                  <p>21 K</p>
                </div>
              </div>
            </div>
          </article>
          <article>
            <div class="coffee-card">
              <div class="coffee-image">
                <img src="assets/images/espresso.svg" alt="" />
              </div>
              <div class="coffee-description">
                <div class="coffee-text flex justify-between">
                  <h2>Espresso</h2>
                  <p>12 K</p>
                </div>
              </div>
            </div>
          </article>
          <article>
            <div class="coffee-card">
              <div class="coffee-image">
                <img src="assets/images/hazelnut latte.svg" alt="" />
              </div>
              <div class="coffee-description">
                <div class="coffee-text flex justify-between">
                  <h2>Hazelnut Latte</h2>
                  <p>23 K</p>
                </div>
              </div>
            </div>
          </article>
        </section>
      </section>
    </main>
  </body>
  <script src="assets/js/main.js"></script>
</html>
